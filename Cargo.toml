[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/JIA-ss/ai-remote"
authors = ["JIA-ss"]

[workspace.dependencies]
ar-core = { path = "crates/ar-core" }
ar-net = { path = "crates/ar-net" }
ar-host = { path = "crates/ar-host" }
ar-controller = { path = "crates/ar-controller" }

# Transport, identity, pairing, gate and revocation: mcpmesh (exact pins; see docs/architecture.md).
mcpmesh-node = "=0.58.0"
mcpmesh-local-api = { version = "=0.58.0", features = ["client", "service"] }
# Must match the rmcp version our mcpmesh fork pins.
rmcp = { version = "=3.5.1", default-features = false, features = ["base64", "server", "client", "macros", "transport-async-rw", "transport-io", "transport-child-process"] }

anyhow = "1"
futures = "0.3"
arboard = "3"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
directories = "6"
# Canonical paths without the `\\?\` prefix on Windows (shown to people and passed to system tools).
dunce = "1"
enigo = "0.6"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# macOS LaunchAgent property lists (`ai-remote host install`).
plist = "1"
process-wrap = { version = "9", features = ["tokio1"] }
quick-xml = "0.42"
rfd = "0.17"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Reading Windows Firewall rules (doctor, `host status`); rules are written with netsh.exe.
windows_firewall = "0.8"
xcap = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1

# mcpmesh 0.58.0 exact-pins iroh 1.2, rmcp 3.1 and a yanked iroh-blobs 0.103.0. Our fork changes only
# those three pins (iroh 1.3.0, rmcp 3.5.1, iroh-blobs 0.103.1); everything else is upstream.
[patch.crates-io]
mcpmesh-node = { git = "https://github.com/JIA-ss/mcpmesh", rev = "e0bc46c5b2ec165bd16f69cfc49bcf67e8186b28" }
mcpmesh-net = { git = "https://github.com/JIA-ss/mcpmesh", rev = "e0bc46c5b2ec165bd16f69cfc49bcf67e8186b28" }
mcpmesh-trust = { git = "https://github.com/JIA-ss/mcpmesh", rev = "e0bc46c5b2ec165bd16f69cfc49bcf67e8186b28" }
mcpmesh-local-api = { git = "https://github.com/JIA-ss/mcpmesh", rev = "e0bc46c5b2ec165bd16f69cfc49bcf67e8186b28" }
mcpmesh-codec = { git = "https://github.com/JIA-ss/mcpmesh", rev = "e0bc46c5b2ec165bd16f69cfc49bcf67e8186b28" }
