name: AIRemote
options:
  bundleIdPrefix: io.github.jia-ss
  deploymentTarget:
    iOS: "17.0"
packages:
  AIRemotePhone:
    path: .
targets:
  AIRemote:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: AIRemotePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jia-ss.ai-remote.ios
        PRODUCT_NAME: ai-remote
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.0.1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ai-remote
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 连接你已配对的电脑，显示实时画面并发送你授权的操作。
        NSBonjourServices: ["_irohv1._udp"]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
