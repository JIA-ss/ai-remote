[package]
name = "ai-remote-desktop"
description = "ai-remote desktop app: watch, approve and steer AI agents on your computers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "ai_remote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ar-core.workspace = true
ar-controller.workspace = true
ar-net.workspace = true
anyhow.workspace = true
# The clipboard of this computer, synced with the host's while you drive.
arboard.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
# Windows: native Snap Layouts on a custom title bar (no-op elsewhere).
tauri-plugin-frame = "1.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio.workspace = true
# This computer's Downloads folder, where files from the host's clipboard land.
directories.workspace = true

# Debug smoke runs capture the app's own window (PrintWindow) to check what it draws.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

# macOS smoke tests snapshot our WKWebView, without screen-recording permission.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
