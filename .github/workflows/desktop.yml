name: Desktop and core
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-e2e:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: desktop-acceptance-${{ github.sha }}
          restore-keys: |
            desktop-rust-1.95-macos-15-${{ hashFiles('Cargo.lock') }}-
      - run: cargo build -p ai-remote --locked
      - run: npm ci && npx tauri build --debug --no-bundle
        working-directory: apps/desktop
      - name: Native conversation and workspace acceptance
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          result=0
          for name in claude codex workspace; do
            if [[ "$name" == claude ]]; then script=tools/desktop-chat-e2e.js; query='view=session';
            elif [[ "$name" == codex ]]; then script=tools/desktop-chat-codex-e2e.js; query='view=session';
            else script=tools/desktop-workspace-e2e.js; query='view=devices&shotlang=zh&shottheme=dark'; fi
            mkdir -p "target/native-e2e/$name"
            if [[ "$name" == workspace ]]; then export E2E_QUERY="$query"; else unset E2E_QUERY; fi
            E2E_SCRIPT="$script" python3 -u tools/desktop-chat-e2e.py --visible --secs 600 --out "target/native-e2e/$name" > "target/native-e2e/$name.log" 2>&1 || result=1
            cat "target/native-e2e/$name.log"
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-conversation-acceptance
          path: target/native-e2e/
          retention-days: 3
