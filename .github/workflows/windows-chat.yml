name: Windows desktop chat acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/ai-remote/**'
      - 'crates/ar-controller/**'
      - 'crates/ar-core/**'
      - 'crates/ar-host/**'
      - 'crates/ar-net/**'
      - 'tools/desktop-chat*'
      - 'tools/desktop-workspace*'
      - 'tools/desktop_chat_ci_windows.py'
      - 'tools/test_desktop_chat_windows_ci.py'
      - 'tools/fake-codex-app-server.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows-chat.yml'
permissions:
  contents: read
jobs:
  windows-chat:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize evidence
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "target/windows-chat-ci/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $output | Out-Null
          @{ schema = 1; platform = 'windows-2025'; source_sha = '${{ github.sha }}'; phase = 'before_build'; visual_qa = 'pending'; artifact_scope = 'typed summaries and test-UI-only crops' } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'preflight.json')
          "CHAT_CI_EVIDENCE=$output" >> $env:GITHUB_ENV
          "CHAT_CI_PRIVATE=$(Join-Path $env:RUNNER_TEMP "desktop-chat-private-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: windows-chat-rust-1.95-windows-2025-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            desktop-rust-1.95-windows-2025-${{ hashFiles('Cargo.lock') }}-
      - name: Evidence dependencies and runner tests
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p test_desktop_chat_windows_ci.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record installed WebView2 runtime
        run: |
          $roots = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:ProgramFiles/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")
          $versions = @($roots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue } | ForEach-Object { $_.VersionInfo.ProductVersion } | Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object -Unique)
          @{ engine = 'WebView2'; installed_versions = $versions; runtime_pinned = $false } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:CHAT_CI_EVIDENCE 'webview-runtime.json')
          if ($versions.Count -eq 0) { throw 'No installed WebView2 runtime was found; acceptance cannot be skipped.' }
      - name: Build isolated CLI
        run: |
          cargo build -p ai-remote --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Tauri debug desktop
        working-directory: apps/desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tauri build --debug --no-bundle --ci -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Six fake-agent suites, two separate rounds each
        run: |
          python tools/desktop-chat-windows-ci.py --out "$env:CHAT_CI_EVIDENCE" --private-root "$env:CHAT_CI_PRIVATE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload typed evidence and safe test UI crops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-chat-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CHAT_CI_EVIDENCE }}/preflight.json
            ${{ env.CHAT_CI_EVIDENCE }}/webview-runtime.json
            ${{ env.CHAT_CI_EVIDENCE }}/matrix-results.json
            ${{ env.CHAT_CI_EVIDENCE }}/test-ui/*/*.png
          if-no-files-found: error
          retention-days: 7
