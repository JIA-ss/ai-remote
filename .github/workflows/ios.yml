name: iPhone controller
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [A-initial-no-clip, B-initial-with-clip, C-initial-alignment-no-clip, D-eager-no-clip]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      UI_RUN: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-layout-framework
          path: apps/ios/Generated/
          run-id: 39943578229
          github-token: ${{ github.token }}
      - name: Apply one anchor diagnostic
        run: |
          if [[ "$UI_RUN" == D-eager-no-clip ]]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('apps/ios/Sources/PhoneChatView.swift')
          s = p.read_text()
          a = 'LazyVStack(alignment: .leading, spacing: codex ? 28 : 14)'
          assert a in s
          p.write_text(s.replace(a, 'VStack(alignment: .leading, spacing: codex ? 28 : 14)', 1))
          PYCODE
          else
            git apply ".github/ios-anchor-variants/$UI_RUN.patch"
          fi
      - run: brew install xcodegen && cd apps/ios && xcodegen generate
      - name: Run UI acceptance on an explicit simulator
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for runtime, group in json.load(sys.stdin)["devices"].items() if runtime.endswith(".iOS-26-2") for d in group if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          args=(-project apps/ios/AIRemote.xcodeproj -scheme AIRemote -destination "id=$simulator" -configuration Debug -derivedDataPath target/ios-build -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO)
          if [[ "$UI_RUN" == suite ]]; then
            xcodebuild "${args[@]}" -resultBundlePath target/suite.xcresult \
              -only-testing:AIRemoteUITests/PhoneCodexUITests -only-testing:AIRemoteUITests/PhoneChatUITests test
          else
            xcodebuild "${args[@]}" -resultBundlePath target/fold-1.xcresult \
              -only-testing:AIRemoteUITests/PhoneCodexUITests/testCodexTurnFoldsAndOpensToGroupsShellsAndDiffs test
            for n in 2 3; do
              xcodebuild "${args[@]}" -resultBundlePath "target/fold-$n.xcresult" \
                -only-testing:AIRemoteUITests/PhoneCodexUITests/testCodexTurnFoldsAndOpensToGroupsShellsAndDiffs test-without-building
            done
          fi
      - name: Inspect accessibility tools available on this Mac
        if: always()
        run: |
          xcrun simctl help 2>&1 | head -60
          test -d "$DEVELOPER_DIR/Applications/Accessibility Inspector.app" && echo 'Accessibility Inspector is installed'
          osascript -e 'tell application "System Events" to get UI elements enabled' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-acceptance-${{ matrix.run }}
          path: target/*.xcresult
          retention-days: 3
