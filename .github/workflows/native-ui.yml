name: Native structured UI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Check native library
        run: cargo clippy -p ar-ui --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test -p ar-ui --locked
      - name: Windows real UIA fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test -p ar-ui --locked --test native -- --ignored --nocapture 2>&1 | Tee-Object -FilePath native-ui-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows remote host UI acceptance
        if: runner.os == 'Windows'
        run: |
          cargo build -p ai-remote --locked
          python tools/ui-smoke.py
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-native-ui-evidence
          path: |
            native-ui-e2e.log
            target/ui-validation/
