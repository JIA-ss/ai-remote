<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1040" width="1760" height="1040" role="img"><title>ai-remote: AI-native remote control across devices over P2P</title><desc>Mac and Windows implementations; iOS, iPadOS, Android and Linux WIP. Native MCP, encrypted QUIC, owner takeover.</desc><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.z{font-family:'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}</style><rect width="1760" height="1040" rx="36" fill="#0d1117"/><polygon points="114.9,62.5 114.9,104.9 104.0,95.2 96.7,111.5 88.3,107.7 95.6,91.6 82.3,91.6" fill="#6F9BFF" stroke="#6F9BFF" stroke-width="1.2" stroke-linejoin="round" /><polygon points="119.1,62.5 119.1,104.9 129.9,95.2 137.3,111.5 145.7,107.7 138.4,91.6 151.7,91.6" fill="#F3B53F" stroke="#F3B53F" stroke-width="1.2" stroke-linejoin="round" /><text class="s" x="178" y="95" font-size="46" font-weight="650" fill="#E6EDF3">ai-remote</text><text class="s" x="1680" y="91" font-size="23" text-anchor="end" fill="#9198A1">OPEN SOURCE · PRE-ALPHA</text><text class="s" x="84" y="173" font-size="26" font-weight="600" fill="#8DB0FF">MULTI-DEVICE / P2P / MCP</text><text class="s" x="80" y="283" font-size="106" font-weight="700" fill="#E6EDF3">AI-native.</text><text class="s" x="80" y="383" font-size="76" font-weight="700" fill="#E6EDF3">Remote, across devices.</text><text class="s" x="84" y="447" font-size="30" fill="#9198A1">Your phone. Your tablet. Your computer. Your agent.</text><text class="s" x="84" y="493" font-size="30" fill="#9198A1">Encrypted end to end. P2P first. You keep control.</text><g fill="none" stroke="#6F9BFF" stroke-width="3"><path d="M1230 277 V330 H1378 M1530 277 V330 H1378"/><path d="M1240 420 V360 H1378 M1530 420 V360 H1378" stroke-dasharray="8 7"/></g><rect x="1120" y="175" width="210" height="102" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2"/><rect x="1144" y="195" width="50" height="35" rx="4" fill="none" stroke="#9198A1" stroke-width="2"/><path d="M1169 230 V240 M1153 240 H1185" stroke="#9198A1" stroke-width="2"/><text class="s" x="1212" y="231" font-size="25" font-weight="600" fill="#E6EDF3">Mac</text><rect x="1430" y="175" width="210" height="102" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2"/><rect x="1454" y="195" width="50" height="35" rx="4" fill="none" stroke="#9198A1" stroke-width="2"/><path d="M1479 230 V240 M1463 240 H1495" stroke="#9198A1" stroke-width="2"/><text class="s" x="1522" y="231" font-size="25" font-weight="600" fill="#E6EDF3">Windows</text><rect x="1230" y="308" width="300" height="76" rx="20" fill="#11161D" stroke="#6F9BFF" stroke-width="2"/><text class="s" x="1380" y="357" font-size="30" font-weight="650" text-anchor="middle" fill="#8DB0FF">P2P / QUIC</text><rect x="1120" y="420" width="210" height="94" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2" stroke-dasharray="8 7"/><rect x="1148" y="438" width="30" height="54" rx="7" fill="none" stroke="#9198A1" stroke-width="2"/><text class="s" x="1213" y="455" font-size="25" font-weight="600" fill="#E6EDF3">iPhone</text><text class="s" x="1213" y="487" font-size="22" fill="#9198A1">WIP</text><rect x="1430" y="420" width="210" height="94" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2" stroke-dasharray="8 7"/><rect x="1458" y="438" width="49" height="54" rx="7" fill="none" stroke="#9198A1" stroke-width="2"/><text class="s" x="1523" y="455" font-size="25" font-weight="600" fill="#E6EDF3">iPad</text><text class="s" x="1523" y="487" font-size="22" fill="#9198A1">WIP</text><rect x="80" y="561" width="512" height="195" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2"/><text class="s" x="108" y="608" font-size="24" font-weight="600" fill="#8DB0FF">01 / AI NATIVE</text><text class="s" x="108" y="670" font-size="29" font-weight="650" fill="#E6EDF3">Your agent, on your devices</text><text class="s" x="108" y="720" font-size="22" fill="#9198A1">Native MCP · UI trees · permitted tools</text><rect x="624" y="561" width="512" height="195" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2"/><text class="s" x="652" y="608" font-size="24" font-weight="600" fill="#8DB0FF">02 / P2P</text><text class="s" x="652" y="670" font-size="29" font-weight="650" fill="#E6EDF3">Paired devices. Direct paths.</text><text class="s" x="652" y="720" font-size="22" fill="#9198A1">QUIC · NAT traversal · relay fallback</text><rect x="1168" y="561" width="512" height="195" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2"/><text class="s" x="1196" y="608" font-size="24" font-weight="600" fill="#F3B53F">03 / HUMAN CONTROL</text><text class="s" x="1196" y="670" font-size="29" font-weight="650" fill="#E6EDF3">Watch. Take over. Hand back.</text><text class="s" x="1196" y="720" font-size="22" fill="#9198A1">Live view · activity · access levels</text><text class="s" x="84" y="807" font-size="27" font-weight="600" fill="#E6EDF3">One project. Your devices, connected.</text><rect x="80" y="839" width="240" height="135" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2"/><text class="s" x="100" y="878" font-size="28" font-weight="650" fill="#E6EDF3">macOS</text><text class="s" x="100" y="916" font-size="23" fill="#9198A1">Mac</text><text class="s" x="100" y="953" font-size="22" font-weight="600" fill="#8DB0FF">Implemented</text><rect x="352" y="839" width="240" height="135" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2"/><text class="s" x="372" y="878" font-size="28" font-weight="650" fill="#E6EDF3">Windows</text><text class="s" x="372" y="916" font-size="23" fill="#9198A1">PC</text><text class="s" x="372" y="953" font-size="22" font-weight="600" fill="#8DB0FF">Implemented</text><rect x="624" y="839" width="240" height="135" rx="20" fill="#11161D" stroke="#30363D" stroke-width="2" stroke-dasharray="8 7"/><text class="s" x="644" y="878" font-size="28" 