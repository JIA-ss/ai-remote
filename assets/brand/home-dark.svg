<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 900" width="1760" height="900" role="img"><title>ai-remote: MCP remote control with owner takeover</title><desc>Blue represents the agent; amber represents the owner. Phone controller remains experimental.</desc><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.z{font-family:'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}</style><rect width="1760" height="900" rx="36" fill="#0d1117"/><polygon points="114.9,78.5 114.9,120.9 104.0,111.2 96.7,127.5 88.3,123.7 95.6,107.6 82.3,107.6" fill="#6F9BFF" stroke="#6F9BFF" stroke-width="1.2" stroke-linejoin="round" /><polygon points="119.1,78.5 119.1,120.9 129.9,111.2 137.3,127.5 145.7,123.7 138.4,107.6 151.7,107.6" fill="#F3B53F" stroke="#F3B53F" stroke-width="1.2" stroke-linejoin="round" /><text class="s" x="178" y="116" font-size="46" font-weight="650" fill="#E6EDF3">ai-remote</text><text class="m" x="1640" y="111" font-size="23" text-anchor="end" fill="#9198A1">OPEN SOURCE · PRE-ALPHA</text><text class="s" x="80" y="274" font-size="102" font-weight="700" fill="#E6EDF3">Your agent works.</text><text class="s" x="80" y="400" font-size="102" font-weight="700" fill="#E6EDF3">You keep the controls.</text><text class="s" x="84" y="465" font-size="34" fill="#9198A1">Remote MCP. Encrypted pairing. Take over any time.</text><polygon points="1457.8,224.9 1457.8,414.0 1409.2,370.4 1376.5,443.1 1338.9,426.2 1371.7,354.6 1312.2,354.6" fill="#6F9BFF" stroke="#6F9BFF" stroke-width="5.3" stroke-linejoin="round" /><polygon points="1476.2,224.9 1476.2,414.0 1524.8,370.4 1557.5,443.1 1595.1,426.2 1562.3,354.6 1621.8,354.6" fill="#F3B53F" stroke="#F3B53F" stroke-width="5.3" stroke-linejoin="round" /><rect x="80" y="540" width="1600" height="270" rx="24" fill="#11161D" stroke="#30363D" stroke-width="2"/><path d="M616 572 V778 M1160 572 V778" stroke="#30363D" stroke-width="2"/><text class="m" x="116" y="610" font-size="25" fill="#6F9BFF">01  CONNECT</text><text class="s" x="116" y="686" font-size="30" font-weight="600" fill="#E6EDF3">Connect your agent</text><text class="m" x="116" y="740" font-size="22" fill="#9198A1">Codex · Claude · Cursor · VS Code</text><text class="m" x="652" y="610" font-size="25" fill="#9198A1">02  PAIR</text><text class="s" x="652" y="686" font-size="30" font-weight="600" fill="#E6EDF3">Pair once. Set the level.</text><text class="m" x="652" y="740" font-size="22" fill="#9198A1">observe → control → admin</text><text class="m" x="1196" y="610" font-size="25" fill="#F3B53F">03  TAKE OVER</text><text class="s" x="1196" y="686" font-size="30" font-weight="600" fill="#E6EDF3">Your turn. Any time.</text><text class="m" x="1196" y="740" font-size="22" fill="#9198A1">Pause · take over · hand back</text><text class="s" x="82" y="865" font-size="26" fill="#9198A1">Windows + macOS · iPhone controller source in development</text></svg>
