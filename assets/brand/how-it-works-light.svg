<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 800" width="1760" height="800" role="img"><title>Multi-device P2P remote control and AI-native architecture</title><desc>AI agents use the local MCP bridge; human apps use the shared controller. Both reach paired Mac and Windows hosts via encrypted QUIC, direct when possible with relay fallback. iOS, iPadOS, Android and Linux are WIP.</desc><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.z{font-family:'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}</style><text class="s" x="40" y="52" font-size="36" font-weight="650" fill="#1F2328">Your agent and you. The same paired devices.</text><text class="s" x="40" y="97" font-size="26" fill="#59636E">AI-native tools + multi-device P2P remote control</text><rect x="40" y="140" width="400" height="192" rx="18" fill="#F6F8FA" stroke="#2F5BD3" stroke-width="2"/><g transform="translate(88 178)"><polygon points="0.0,0.0 0.0,31.2 -8.0,24.0 -13.4,36.0 -19.6,33.2 -14.2,21.4 -24.0,21.4" fill="#2F5BD3" stroke="#2F5BD3" stroke-width="0.9" stroke-linejoin="round" /></g><text class="s" x="120" y="210" font-size="30" font-weight="650" fill="#2F5BD3">AI Native / MCP</text><text class="s" x="72" y="264" font-size="27" fill="#1F2328">Codex · Claude Code</text><text class="s" x="72" y="302" font-size="25" fill="#59636E">Cursor · VS Code · your agent</text><rect x="40" y="386" width="400" height="240" rx="18" fill="#F6F8FA" stroke="#C17C00" stroke-width="2"/><text class="s" x="72" y="431" font-size="30" font-weight="650" fill="#8F5400">Your controller apps</text><text class="s" x="72" y="480" font-size="27" fill="#1F2328">Mac · Windows</text><text class="s" x="72" y="524" font-size="26" fill="#59636E">iOS / iPhone · WIP</text><text class="s" x="72" y="565" font-size="26" fill="#59636E">iPadOS / iPad · WIP</text><text class="s" x="72" y="606" font-size="26" fill="#59636E">Android · WIP</text><path d="M440 235 H524 M440 506 H524" fill="none" stroke="#59636E" stroke-width="3"/><text class="s" x="482" y="214" font-size="20" text-anchor="middle" fill="#2F5BD3">MCP</text><rect x="524" y="140" width="350" height="486" rx="18" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="2"/><text class="s" x="556" y="206" font-size="36" font-weight="650" fill="#1F2328">ai-remote</text><text class="s" x="556" y="257" font-size="27" fill="#2F5BD3">Local MCP bridge</text><text class="s" x="556" y="299" font-size="27" fill="#8F5400">+ shared controller</text><path d="M556 337 H842" stroke="#D1D9E0" stroke-width="2"/><text class="s" x="556" y="383" font-size="26" fill="#59636E">Pair by device identity</text><text class="s" x="556" y="428" font-size="26" fill="#59636E">Levels · turns · takeover</text><text class="s" x="556" y="473" font-size="26" fill="#59636E">Screens + structured UI</text><text class="s" x="556" y="518" font-size="26" fill="#59636E">Input + permitted tools</text><text class="s" x="556" y="591" font-size="25" font-weight="600" fill="#1F2328">For you and your agent</text><path d="M874 310 H1230 M874 320 H1230" stroke="#2F5BD3" stroke-width="3"/><text class="s" x="1052" y="251" font-size="32" font-weight="650" text-anchor="middle" fill="#2F5BD3">P2P / QUIC</text><text class="s" x="1052" y="292" font-size="24" text-anchor="middle" fill="#59636E">End-to-end encrypted</text><text class="s" x="1052" y="362" font-size="23" text-anchor="middle" fill="#59636E">NAT traversal · direct first</text><path d="M900 320 V466 H952 M1152 466 H1204 V320" fill="none" stroke="#59636E" stroke-width="2" stroke-dasharray="8 7"/><rect x="952" y="430" width="200" height="74" rx="18" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="2" stroke-dasharray="8 7"/><text class="s" x="1052" y="477" font-size="24" text-anchor="middle" fill="#1F2328">Encrypted relay</text><text class="s" x="1052" y="548" font-size="24" text-anchor="middle" fill="#59636E">Fallback when needed</text><text class="s" x="1258" y="118" font-size="26" fill="#59636E">Paired host computers</text><rect x="1230" y="140" width="490" height="142" rx="18" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="2"/><text class="s" x="1262" y="194" font-size="33" font-weight="650" fill="#1F2328">macOS / Mac</text><text class="s" x="1262" y="244" font-size="26" fill="#59636E">Implemented · native AX</text><rect x="1230" y="312" width="490" height="142" rx="18" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="2"/><text class="s" x="1262" y="366" font-size="33" font-weight="650" fill="#1F2328">Windows / PC</text><text class="s" x="1262" y="416" font-size="26" fill="#59636E">Implemented · native UIA</text><rect x="1230" y="484" width="490" height="142" rx="18" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="2" stroke-dasharray="8 7"/><text class="s" x="1262" y="538" font-size="33" font-weight="650" fill="#1F2328">Linux / WIP</text><text class="s" x="1262" y="588" font-size="26" fill="#59636E">Desktop support in progress</text><rect x="40" y="674" width="1680" height="86" rx="18" fill="#F6F8FA" stroke="#C17C00" stroke-width="2"/><text class="s" x="74" y="728" font-size="28" fill="#1F2328">You stay in control: set access, watch activity, take over, hand back, and approve risky steps.</text></svg>
