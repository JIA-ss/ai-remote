<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 600" width="1760" height="600" role="img"><title>ai-remote 的工作方式：AI Agent 通过 stdio 上的 MCP 连接你电脑上的 ai-remote mcp，再按公钥拨号，经 QUIC 直连到达每台已配对的被控端，加密中继只作兜底，被控端不用开放任何端口。你为每台设备设定权限，审批高风险操作，随时可以接管或撤销。</title><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.z{font-family:'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}</style><text class="z" x="36" y="52" font-size="24" fill="#59636E">Agent</text><text class="z" x="500" y="52" font-size="24" fill="#59636E">你的电脑</text><text class="z" x="1180" y="52" font-size="24" fill="#59636E">你控制的机器</text><rect x="30" y="80" width="356" height="220" rx="14" fill="#FFFFFF" stroke="#2F5BD3" stroke-width="2"/><g transform="translate(100 124)"><polygon points="0.0,0.0 0.0,35.9 -9.2,27.6 -15.4,41.4 -22.5,38.2 -16.3,24.6 -27.6,24.6" fill="#2F5BD3" stroke="#2F5BD3" stroke-width="1.0" stroke-linejoin="round" /></g><text class="z" x="134" y="158" font-size="30" font-weight="600" fill="#1F2328">AI Agent</text><text class="z" x="70" y="216" font-size="25" fill="#59636E">Claude Code、Cursor</text><text class="z" x="70" y="252" font-size="25" fill="#59636E">或你自己写的 Agent</text><path d="M392,190 H486" stroke="#59636E" stroke-width="2.5"/><path d="M478,181 L490,190 L478,199" fill="none" stroke="#59636E" stroke-width="2.5" stroke-linejoin="round"/><text class="s" x="440" y="168" font-size="24" text-anchor="middle" fill="#59636E">MCP</text><text class="m" x="440" y="226" font-size="24" text-anchor="middle" fill="#59636E">stdio</text><rect x="496" y="80" width="366" height="220" rx="14" fill="#FFFFFF" stroke="#C3CCD5" stroke-width="2"/><text class="m" x="536" y="158" font-size="28" font-weight="700" fill="#1F2328">ai-remote mcp</text><text class="z" x="536" y="216" font-size="25" fill="#59636E">保存配对关系</text><text class="z" x="536" y="252" font-size="25" fill="#59636E">和设备密钥</text><path d="M868,184 H1174 M868,196 H1174" stroke="#1F2328" stroke-width="3"/><circle cx="868" cy="190" r="9" fill="#ffffff" stroke="#1F2328" stroke-width="3"/><circle cx="1174" cy="190" r="9" fill="#ffffff" stroke="#1F2328" stroke-width="3"/><text class="z" x="1021" y="160" font-size="26" font-weight="600" text-anchor="middle" fill="#1F2328">QUIC 直连</text><text class="z" x="1021" y="236" font-size="24" text-anchor="middle" fill="#59636E">按公钥拨号</text><text class="z" x="1021" y="266" font-size="24" text-anchor="middle" fill="#59636E">自动穿透 NAT</text><rect x="1206" y="120" width="524" height="292" rx="14" fill="#F6F8FA" stroke="#C3CCD5" stroke-width="2" stroke-dasharray="10 8"/><text class="s" x="1242" y="394" font-size="25" font-weight="600" fill="#59636E">studio-mac</text><text class="z" x="1392" y="394" font-size="23" fill="#59636E">macOS，计划在 M1 支持</text><rect x="1180" y="80" width="550" height="262" rx="14" fill="#FFFFFF" stroke="#C3CCD5" stroke-width="2"/><text class="s" x="1216" y="134" font-size="28" font-weight="600" fill="#1F2328">office-pc</text><text class="z" x="1216" y="170" font-size="22" fill="#59636E">Windows，运行 ai-remote host，无需开放端口</text><rect x="1216" y="200" width="154" height="44" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text class="z" x="1293" y="230" font-size="23" text-anchor="middle" fill="#1F2328">截图</text><rect x="1382" y="200" width="154" height="44" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text class="z" x="1459" y="230" font-size="23" text-anchor="middle" fill="#1F2328">界面树</text><rect x="1548" y="200" width="154" height="44" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text class="z" x="1625" y="230" font-size="23" text-anchor="middle" fill="#1F2328">元素操作</text><rect x="1216" y="256" width="154" height="44" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text class="z" x="1293" y="286" font-size="23" text-anchor="middle" fill="#1F2328">鼠标键盘</text><rect x="1382" y="256" width="154" height="44" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text class="z" x="1459" y="286" font-size="23" text-anchor="middle" fill="#1F2328">窗口</text><rect x="1548" y="256" width="154" height="44" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1.5"/><text class="z" x="1625" y="286" font-size="23" text-anchor="middle" fill="#1F2328">shell</text><path d="M760,300 V350 H940" fill="none" stroke="#59636E" stroke-width="2.5" stroke-dasharray="9 8"/><path d="M1104,350 H1142 V300 H1180" fill="none" stroke="#59636E" stroke-width="2.5" stroke-dasharray="9 8" stroke-linejoin="round"/><rect x="940" y="316" width="164" height="68" rx="14" fill="#F6F8FA" stroke="#C3CCD5" stroke-width="2"/><text class="z" x="1022" y="359" font-size="24" font-weight="600" text-anchor="middle" fill="#1F2328">中继</text><text class="z" x="1022" y="426" font-size="24" text-anchor="middle" fill="#59636E">只作兜底，只能看到密文</text><rect x="30" y="490" width="1700" height="84" rx="14" fill="#F0A62B" fill-opacity="0.18" stroke="#C17C00" stroke-width="2"/><g transform="translate(62 512)"><polygon points="0.0,0.0 0.0,32.8 8.4,25.2 14.1,37.8 20.6,34.9 14.9,22.5 25.2,22.5" fill="#F0A62B" stroke="#F0A62B" stroke-width="0.9" stroke-linejoin="round" /></g><text class="z" x="110" y="542" font-size="27" fill="#1F2328">你为每台设备设定权限级别，审批高风险操作，查看审计日志，随时可以接管或撤销。</text></svg>
