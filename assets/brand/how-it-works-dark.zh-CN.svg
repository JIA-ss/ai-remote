<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 800" width="1760" height="800" role="img"><title>多端 P2P 远程控制与 AI Native 架构</title><desc>AI agents use the local MCP bridge; human apps use the shared controller. Both reach paired Mac and Windows hosts via encrypted QUIC, direct when possible with relay fallback. iOS, iPadOS, Android and Linux are WIP.</desc><style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.z{font-family:'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}</style><text class="z" x="40" y="52" font-size="36" font-weight="650" fill="#E6EDF3">AI 与你，连接同一组设备。</text><text class="z" x="40" y="97" font-size="26" fill="#9198A1">AI Native 工具 + 多端 P2P 远程控制</text><rect x="40" y="140" width="400" height="192" rx="18" fill="#11161D" stroke="#6F9BFF" stroke-width="2"/><g transform="translate(88 178)"><polygon points="0.0,0.0 0.0,31.2 -8.0,24.0 -13.4,36.0 -19.6,33.2 -14.2,21.4 -24.0,21.4" fill="#6F9BFF" stroke="#6F9BFF" stroke-width="0.9" stroke-linejoin="round" /></g><text class="s" x="120" y="210" font-size="30" font-weight="650" fill="#8DB0FF">AI Native / MCP</text><text class="s" x="72" y="264" font-size="27" fill="#E6EDF3">Codex · Claude Code</text><text class="z" x="72" y="302" font-size="25" fill="#9198A1">Cursor · VS Code · 自建 Agent</text><rect x="40" y="386" width="400" height="240" rx="18" fill="#11161D" stroke="#F3B53F" stroke-width="2"/><text class="z" x="72" y="431" font-size="30" font-weight="650" fill="#F3B53F">你的控制端</text><text class="s" x="72" y="480" font-size="27" fill="#E6EDF3">Mac · Windows</text><text class="s" x="72" y="524" font-size="26" fill="#9198A1">iOS / iPhone · WIP</text><text class="s" x="72" y="565" font-size="26" fill="#9198A1">iPadOS / iPad · WIP</text><text class="s" x="72" y="606" font-size="26" fill="#9198A1">Android · WIP</text><path d="M440 235 H524 M440 506 H524" fill="none" stroke="#9198A1" stroke-width="3"/><text class="s" x="482" y="214" font-size="20" text-anchor="middle" fill="#8DB0FF">MCP</text><rect x="524" y="140" width="350" height="486" rx="18" fill="#11161D" stroke="#30363D" stroke-width="2"/><text class="s" x="556" y="206" font-size="36" font-weight="650" fill="#E6EDF3">ai-remote</text><text class="z" x="556" y="257" font-size="27" fill="#8DB0FF">MCP 桥接</text><text class="z" x="556" y="299" font-size="27" fill="#F3B53F">+ 共享控制核心</text><path d="M556 337 H842" stroke="#30363D" stroke-width="2"/><text class="z" x="556" y="383" font-size="26" fill="#9198A1">按设备身份配对</text><text class="z" x="556" y="428" font-size="26" fill="#9198A1">权限 · 轮次 · 接管</text><text class="z" x="556" y="473" font-size="26" fill="#9198A1">截图 + 结构化 UI</text><text class="z" x="556" y="518" font-size="26" fill="#9198A1">鼠标键盘 + 授权工具</text><text class="z" x="556" y="591" font-size="25" font-weight="600" fill="#E6EDF3">你与 AI 共享控制通道</text><path d="M874 310 H1230 M874 320 H1230" stroke="#6F9BFF" stroke-width="3"/><text class="s" x="1052" y="251" font-size="32" font-weight="650" text-anchor="middle" fill="#8DB0FF">P2P / QUIC</text><text class="z" x="1052" y="292" font-size="24" text-anchor="middle" fill="#9198A1">端到端加密</text><text class="z" x="1052" y="362" font-size="23" text-anchor="middle" fill="#9198A1">NAT 穿透 · 优先直连</text><path d="M900 320 V466 H952 M1152 466 H1204 V320" fill="none" stroke="#9198A1" stroke-width="2" stroke-dasharray="8 7"/><rect x="952" y="430" width="200" height="74" rx="18" fill="#11161D" stroke="#30363D" stroke-width="2" stroke-dasharray="8 7"/><text class="z" x="1052" y="477" font-size="24" text-anchor="middle" fill="#E6EDF3">加密中继</text><text class="z" x="1052" y="548" font-size="24" text-anchor="middle" fill="#9198A1">无法直连时兜底</text><text class="z" x="1258" y="118" font-size="26" fill="#9198A1">已配对的被控电脑</text><rect x="1230" y="140" width="490" height="142" rx="18" fill="#11161D" stroke="#30363D" stroke-width="2"/><text class="s" 