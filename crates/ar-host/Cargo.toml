[package]
name = "ar-host"
description = "ai-remote host: serves this machine's capabilities as MCP tools behind permissions, approval and audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ar-ui = { path = "../ar-ui" }
ar-core.workspace = true
ar-net.workspace = true
anyhow.workspace = true
arboard.workspace = true
async-trait = "0.1"
base64.workspace = true
blake3.workspace = true
data-encoding.workspace = true
dunce.workspace = true
enigo.workspace = true
futures.workspace = true
image.workspace = true
plist.workspace = true
process-wrap.workspace = true
quick-xml.workspace = true
rfd.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
getrandom.workspace = true
xcap.workspace = true
openh264 = "0.9"
openh264-sys2 = "0.9"
fast_image_resize = "6"
yuvutils-rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
screencapturekit = { version = "=11.0.0", default-features = false }
videotoolbox = { version = "=0.21.0", default-features = false, features = ["compression"] }
apple-cf = { version = "=0.11.0", default-features = false, features = ["cv", "cm", "iosurface"] }
# The pointer picture for viewers that draw it (NSCursor) and the user to drop to at the login window.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor", "NSImage", "NSImageRep", "NSGraphicsContext", "NSResponder", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows_firewall.workspace = true
win32job.workspace = true
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2"

[dev-dependencies]
ring.workspace = true
tempfile.workspace = true
# Paused time for the console watch's pacing test.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

# Mounted-server end-to-end test. It has its own main: the same binary also plays the mock MCP
# server the test mounts, so no separate fixture has to be built or found.
[[test]]
name = "mounts"
harness = false
