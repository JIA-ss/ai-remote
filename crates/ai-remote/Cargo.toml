[package]
name = "ai-remote"
description = "Open-source remote control where AI agents are first-class operators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ai-remote"
path = "src/main.rs"

# The same host without a console window, for starting at login (`ai-remote host install`).
[[bin]]
name = "ai-remote-hostw"
path = "src/bin/ai-remote-hostw.rs"

[features]
# Plain key file as the approver key, for automated tests only (see ar-controller).
software-approver = ["ar-controller/software-approver"]

[dependencies]
ar-core.workspace = true
ar-net.workspace = true
ar-host.workspace = true
ar-controller.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
dunce.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
file-rotate.workspace = true

[target.'cfg(windows)'.dependencies]
# The background host restarts itself after a crash (Task Scheduler does not; see the binary).
win32job.workspace = true
