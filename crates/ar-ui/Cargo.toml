[package]
name = "ar-ui"
description = "Native macOS AX and Windows UIA text-first accessibility primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[dependencies]
anyhow.workspace = true
schemars.workspace = true
serde.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
[target.'cfg(windows)'.dependencies]
uiautomation = { version = "=0.25.1", default-features = false, features = ["pattern", "input"] }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
