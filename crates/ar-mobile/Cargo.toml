[package]
name = "ar-mobile"
description = "In-process ai-remote controller for the iPhone app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ar-core.workspace = true
ar-net.workspace = true
ar-controller.workspace = true
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror = "2"
uniffi = { version = "=0.32.2", features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "ar-mobile-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
